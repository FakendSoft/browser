name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Compute CalVer
        id: version
        run: scripts/next-release-version.sh

      - name: Set bundle version
        run: scripts/set-version.sh "${{ steps.version.outputs.version }}"

      - name: Fetch CEF
        uses: flox/activate-action@v1
        with:
          command: scripts/fetch-cef.sh

      - name: Build app
        uses: flox/activate-action@v1
        with:
          command: scripts/build.sh

      - name: Package DMG
        id: package
        run: scripts/package-dmg.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          SHA256_PATH: ${{ steps.package.outputs.sha256_path }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "$DMG_PATH#Fakend Browser ${VERSION}.dmg" \
            "$SHA256_PATH#Fakend Browser ${VERSION}.dmg.sha256" \
            --target "$GITHUB_SHA" \
            --title "Fakend Browser ${VERSION}" \
            --notes "Manual release ${VERSION}. Includes a macOS arm64 DMG."

